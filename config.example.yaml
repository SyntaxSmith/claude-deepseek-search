plugins:
  enabled: true
  dir: ~/.cli-proxy-api/plugins
  configs:
    claude-deepseek-search:
      enabled: false
      priority: 20
      models:
        - "GLM-*"
      exclude_models: []
      api_key_env: DEEPSEEK
      base_url: https://api.deepseek.com
      require_web_search_only: true
      count: 5
      need_content: false
      timeout_seconds: 30
