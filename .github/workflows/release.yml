name: Build release

on:
  push:
    branches: ['release/**']
  workflow_dispatch:
    inputs:
      version:
        description: Release version (without v)
        required: true
        default: '0.2.0'
      publish:
        description: Publish a GitHub Release after all builds pass
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-22.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - runner: macos-15
            goos: darwin
            goarch: arm64
          - runner: windows-2022
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      VERSION: ${{ inputs.version || '0.2.0' }}
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: go/go.sum
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          path-type: inherit
          install: make mingw-w64-ucrt-x86_64-gcc
      - name: Test and package (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            export CGO_CFLAGS="-mmacosx-version-min=12.0"
            export CGO_LDFLAGS="-mmacosx-version-min=12.0"
          fi
          (cd go && go test -race ./... && go vet ./...)
          make package VERSION="$VERSION" GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }}
      - name: Test and package (Windows)
        if: runner.os == 'Windows'
        shell: 'msys2 {0}'
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          export CC=gcc
          (cd go && go test -race ./... && go vet ./...)
          make package VERSION="$VERSION" GOOS=windows GOARCH=amd64
      - name: Load shared library and check ABI exports
        shell: bash
        run: |
          python -I - <<'PY'
          import ctypes, pathlib
          library = next(p for p in pathlib.Path('build').iterdir() if p.suffix in ('.so', '.dylib', '.dll'))
          handle = ctypes.CDLL(str(library.resolve()))
          for name in ('cliproxy_plugin_init', 'cliproxyPluginCall', 'cliproxyPluginFree', 'cliproxyPluginShutdown'):
              getattr(handle, name)
          print('Loaded', library, 'and verified ABI exports')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish packages and checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum *.tar.gz > checksums.txt)
          gh release create "v$VERSION" dist/*.tar.gz dist/checksums.txt \
            --target "$GITHUB_SHA" --title "v$VERSION" --notes-file RELEASE_NOTES.md
